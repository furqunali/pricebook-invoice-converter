<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDI Invoice Assistant</title>
<style>
  :root{
    --pink:#fff2f7; --pink2:#ffe6f0; --card:#ffffff; --slate:#333849;
    --muted:#8a8fa3; --gold:#d4af37; --gold-soft:#f2d98a; --accent:#2563eb;
    --green:#129d6b; --amber:#e08a00; --red:#d63c4a; --blue:#2563eb;
    --line:#f4d6e4;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--pink),var(--pink2));color:var(--slate);
    display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:820px;display:flex;align-items:center;gap:14px;
    padding:18px 20px 10px}
  .brain{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--gold-soft))}
  .brain svg{width:100%;height:100%}
  .title{font-size:20px;font-weight:700;letter-spacing:.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:1px}
  .wrap{width:100%;max-width:820px;flex:1;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    margin:6px 14px 16px;overflow:hidden;box-shadow:0 10px 30px rgba(212,175,55,.08)}
  #log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;max-width:88%}
  .row.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:30px;height:30px;flex:0 0 auto;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff,#f5e2a8);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px var(--gold-soft)}
  .av svg{width:20px;height:20px}
  .bubble{padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;
    white-space:pre-wrap;word-wrap:break-word}
  .agent .bubble{background:#fbfbfd;border:1px solid #eef0f5;border-left:4px solid var(--blue)}
  .agent.green .bubble{border-left-color:var(--green)}
  .agent.amber .bubble{border-left-color:var(--amber)}
  .agent.red   .bubble{border-left-color:var(--red)}
  .agent.blue  .bubble{border-left-color:var(--blue)}
  .me .bubble{background:#ffe0ee;border:1px solid #ffc9e0}
  .val{color:var(--accent);font-weight:600}
  .tag{font-size:11px;color:var(--muted);margin-top:3px}
  .quick{display:flex;gap:8px;padding:0 18px 6px}
  .quick button{border:none;border-radius:10px;padding:8px 16px;font-size:14px;
    font-weight:600;cursor:pointer}
  .haan{background:var(--green);color:#fff}
  .nahi{background:#f0e1ea;color:var(--slate)}
  form{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);
    background:#fff}
  #msg{flex:1;border:1px solid #f0cfe0;border-radius:12px;padding:11px 14px;
    font-size:15px;outline:none;background:var(--pink)}
  #msg:focus{border-color:var(--gold)}
  #send{border:none;background:linear-gradient(135deg,var(--gold),#c99a24);color:#fff;
    font-weight:700;padding:0 20px;border-radius:12px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(255,240,247,.86);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;
    width:min(360px,90vw);text-align:center;box-shadow:0 12px 40px rgba(212,175,55,.16)}
  .card h2{margin:.2em 0 .1em;font-size:18px}
  .card p{color:var(--muted);font-size:14px;margin:.2em 0 14px}
  .card input{width:100%;padding:11px 13px;border:1px solid #f0cfe0;border-radius:11px;
    font-size:15px;margin-bottom:12px;background:var(--pink)}
  .card button{width:100%;border:none;background:linear-gradient(135deg,var(--gold),#c99a24);
    color:#fff;font-weight:700;padding:11px;border-radius:11px;cursor:pointer;font-size:15px}
  .hidden{display:none!important}
</style>
</head>
<body>
<!-- gold brain SVG (reused for header + avatars) -->
<template id="brainSvg">
  <svg viewBox="0 0 24 24" fill="none" stroke="#c99a24" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
    <path fill="#f2d98a" stroke="#c99a24"
      d="M8.5 3.5A2.5 2.5 0 0 0 6 6a2.3 2.3 0 0 0-1.5 3.8A2.4 2.4 0 0 0 5 14a2.4 2.4 0 0 0 2 3.6 2.3 2.3 0 0 0 4.5.4V4.6A2.4 2.4 0 0 0 8.5 3.5Z"/>
    <path fill="#f2d98a" stroke="#c99a24"
      d="M15.5 3.5A2.5 2.5 0 0 1 18 6a2.3 2.3 0 0 1 1.5 3.8A2.4 2.4 0 0 1 19 14a2.4 2.4 0 0 1-2 3.6 2.3 2.3 0 0 1-4.5.4V4.6A2.4 2.4 0 0 1 15.5 3.5Z"/>
    <path d="M12 7.5h2M12 11h-2M12 14.5h2"/>
  </svg>
</template>

<header>
  <div class="brain" id="hbrain"></div>
  <div>
    <div class="title">PDI Invoice Assistant</div>
    <div class="sub" id="greet">Connect ho raha hai...</div>
  </div>
</header>

<div class="wrap">
  <div id="log"></div>
  <div class="quick hidden" id="quick">
    <button class="haan" onclick="quick('Haan')">Haan</button>
    <button class="nahi" onclick="quick('Nahi')">Nahi</button>
  </div>
  <form id="f" onsubmit="return sendMsg(event)">
    <input id="msg" autocomplete="off" placeholder="Kuch poochein… (Roman Urdu)">
    <button id="send" type="submit">Bhejein</button>
  </form>
</div>

<div class="overlay hidden" id="reg">
  <div class="card">
    <div class="brain" style="width:52px;height:52px;margin:0 auto 8px" id="rbrain"></div>
    <h2>Assalam-o-alaikum!</h2>
    <p>Pehli dafa mile hain — aap ka naam kya hai?</p>
    <input id="rname" placeholder="Aap ka naam" autocomplete="off">
    <button onclick="doRegister()">Shuru karein</button>
  </div>
</div>

<script>
const brain = () => document.getElementById('brainSvg').content.cloneNode(true);
document.getElementById('hbrain').appendChild(brain());
document.getElementById('rbrain').appendChild(brain());

let ME = {name:'', role:'user'};

function highlight(t){
  // escape, then accent important values: batch ids, R/B ids, money, 4-digit codes.
  let s = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g,'<span class="val">$1</span>');
  s = s.replace(/\b([BR]-\d+(?:_[\d-]+)?)\b/g,'<span class="val">$1</span>');
  s = s.replace(/\b(\d+\.\d{2})\b/g,'<span class="val">$1</span>');
  s = s.replace(/\b(\d{4})\b/g,'<span class="val">$1</span>');
  return s;
}
function add(who, text, color){
  const log = document.getElementById('log');
  const row = document.createElement('div');
  row.className = 'row ' + (who==='me' ? 'me' : 'agent ' + (color||'blue'));
  if(who!=='me'){ const a=document.createElement('div'); a.className='av'; a.appendChild(brain()); row.appendChild(a); }
  const b = document.createElement('div'); b.className='bubble'; b.innerHTML = highlight(text);
  row.appendChild(b); log.appendChild(row); log.scrollTop = log.scrollHeight;
}
function showQuick(on){ document.getElementById('quick').classList.toggle('hidden', !on); }

async function whoami(){
  const r = await fetch('/api/whoami'); const j = await r.json();
  ME = j;
  document.getElementById('greet').textContent =
    'Hi ' + j.name + '  •  role: ' + j.role;
  if(!j.known){ document.getElementById('reg').classList.remove('hidden'); }
  else { add('agent','Assalam-o-alaikum ' + j.name + '! Main aap ki kya madad karoon? (status, review, ya report)','blue'); }
}
async function doRegister(){
  const name = document.getElementById('rname').value.trim();
  if(!name) return;
  const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name})});
  const j = await r.json(); ME=j;
  document.getElementById('reg').classList.add('hidden');
  document.getElementById('greet').textContent = 'Hi ' + j.name + '  •  role: ' + j.role;
  add('agent','Shukriya ' + j.name + '! Ab bataiye — status dekhoon, review, ya report?','blue');
}
async function post(message){
  const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message})});
  return r.json();
}
async function sendMsg(e){
  e.preventDefault();
  const inp = document.getElementById('msg'); const m = inp.value.trim();
  if(!m) return false;
  add('me', m); inp.value=''; showQuick(false);
  const j = await post(m);
  add('agent', j.reply, j.status_color);
  showQuick(!!j.pending);
  return false;
}
function quick(v){ document.getElementById('msg').value=v; sendMsg(new Event('submit')); }
whoami();
</script>
</body>
</html>
